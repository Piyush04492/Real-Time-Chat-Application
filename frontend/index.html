<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat Portal</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <!-- Glowing background elements -->
    <div class="glow-bg">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="auth-container glass">
        <div class="auth-header">
            <div class="logo">
                <i class="fa-solid fa-comments-lightning logo-icon"></i>
                <h2>ChatSphere</h2>
            </div>
            <p>Connect instantly. Chat securely.</p>
        </div>

        <!-- Form Tab Selection -->
        <div class="tab-slider-wrapper">
            <div class="tabs">
                <button class="tab-btn active" id="login-tab">Login</button>
                <button class="tab-btn" id="register-tab">Register</button>
                <span class="tab-indicator"></span>
            </div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active">
            <div class="input-group">
                <label for="login-username"><i class="fa-regular fa-user"></i> Username</label>
                <input type="text" id="login-username" placeholder="Enter username" required minlength="3">
            </div>
            <div class="input-group">
                <label for="login-password"><i class="fa-regular fa-lock"></i> Password</label>
                <input type="password" id="login-password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="submit-btn">
                <span>Login</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="auth-message error" id="login-error"></div>
        </form>

        <!-- Registration Form -->
        <form id="register-form" class="auth-form">
            <div class="input-group">
                <label for="register-username"><i class="fa-regular fa-user"></i> Username</label>
                <input type="text" id="register-username" placeholder="Choose a username" required minlength="3" maxlength="50">
            </div>
            <div class="input-group">
                <label for="register-password"><i class="fa-regular fa-lock"></i> Password</label>
                <input type="password" id="register-password" placeholder="Choose a secure password" required minlength="6">
            </div>
            <div class="input-group">
                <label for="register-confirm"><i class="fa-regular fa-lock-keyhole"></i> Confirm Password</label>
                <input type="password" id="register-confirm" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="submit-btn register-btn">
                <span>Create Account</span> <i class="fa-solid fa-user-plus"></i>
            </button>
            <div class="auth-message error" id="register-error"></div>
            <div class="auth-message success" id="register-success"></div>
        </form>
    </div>

    <script>
        // Simple state switching between Login & Register tabs
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const tabIndicator = document.querySelector('.tab-indicator');

        // Redirect if already logged in
        if (localStorage.getItem('token')) {
            window.location.href = 'chat';
        }

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            tabIndicator.style.transform = 'translateX(0%)';
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            tabIndicator.style.transform = 'translateX(100%)';
        });

        // API Endpoint paths
        const API_URL = '/api';

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    throw new Error(`Server returned HTTP ${response.status}: ${response.statusText}`);
                }

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed.');
                }

                // Save token and username
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('username', username);
                window.location.href = 'chat';
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = 'block';
            }
        });

        // Register Handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm').value;

            if (password !== confirmPassword) {
                errorDiv.innerText = "Passwords do not match.";
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    throw new Error(`Server returned HTTP ${response.status}: ${response.statusText}`);
                }

                if (!response.ok) {
                    throw new Error(data.detail || 'Registration failed.');
                }

                successDiv.innerText = "Registration successful! Loading login...";
                successDiv.style.display = 'block';
                registerForm.reset();

                // Auto switch to login tab after 1.5 seconds
                setTimeout(() => {
                    loginTab.click();
                    document.getElementById('login-username').value = username;
                }, 1500);
            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
